name: Auto Update Dashboard

on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Update data snapshots
        run: |
          set +e
          python scripts/update_etf_dashboard.py
          python scripts/update_index_amount_share.py
          python scripts/update_theme_amount_share.py
          python scripts/update_market_turnover.py
          python scripts/update_southbound_flow.py
          python scripts/update_macro_overview.py
          python scripts/update_limit_up_tables.py
          python scripts/update_citic_industry_crowding.py
          set -e
          python scripts/build_site_from_processed.py

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/raw output/charts site
          git commit -m "auto update dashboard data"
          git push
