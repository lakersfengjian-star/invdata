name: Auto Update Dashboard

on:
  schedule:
    # 日频 T+1:UTC 22:00 周一至周五 = 北京时间 06:00 周二至周六,
    # 覆盖前一交易日(周一至周五)收盘数据;周六早同时覆盖本周周频需求。
    - cron: "0 22 * * 1-5"
    # 宏观:UTC 15:00 = 北京时间 23:00,限统计局/央行集中发布窗口
    # (每月 9–20 日:PMI/CPI/PPI/进出口/金融数据/经济数据;28–31 日:PMI/季度GDP)。
    - cron: "0 15 9-20,28-31 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Update data snapshots
        env:
          # 手动刷新跑全量;23:00 宏观窗口只跑宏观;其余为日频 T+1。
          UPDATE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'all' || (github.event.schedule == '0 15 9-20,28-31 * *' && 'macro' || 'daily') }}
        run: |
          python scripts/run_scheduled_updates.py --mode "$UPDATE_MODE"

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/raw output/charts site
          git commit -m "auto update dashboard data"
          git push
