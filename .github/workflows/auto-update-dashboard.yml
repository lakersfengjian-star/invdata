name: Auto Update Dashboard

on:
  schedule:
    # 北京时间每天 06:00。调度器内部按频率判断：
    # - 日频：T+1 06:00 补上一交易日；
    # - 周频：周末/周一 06:00 检查最近完整交易周；
    # - 月/季频：统计局、央行等发布窗口的次日 06:00 尝试补数。
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Update data snapshots
        env:
          # 手动刷新跑全量；定时刷新由本地编排器按频率和发布日期判断。
          UPDATE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'scheduled' }}
        run: |
          python scripts/run_scheduled_updates.py --mode "$UPDATE_MODE"

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No dashboard changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/processed data/raw output/charts site
          git commit -m "auto update dashboard data"
          git push
